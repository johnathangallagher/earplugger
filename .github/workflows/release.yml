name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Create Release Archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dist = "earplugger-$tag-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $dist
          Copy-Item target/release/earplugger.exe -Destination $dist/
          Copy-Item install.bat -Destination $dist/
          Copy-Item uninstall.bat -Destination $dist/
          Copy-Item README.md -Destination $dist/
          Copy-Item LICENSE -Destination $dist/
          Copy-Item SECURITY.md -Destination $dist/
          Compress-Archive -Path "$dist/*" -DestinationPath "$dist.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: earplugger-*-x86_64-pc-windows-msvc.zip
          generate_release_notes: true
