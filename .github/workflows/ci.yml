name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Check Formatting
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo fmt --check
      - name: Clippy Linter
        run: cargo clippy --target ${{ matrix.target }} --all-targets --all-features -- -D warnings
      - name: Run Tests
        run: cargo test --target ${{ matrix.target }} --verbose
      - name: Build Release
        run: cargo build --target ${{ matrix.target }} --release --verbose
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: earplugger-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/earplugger.exe

  msrv:
    name: Verify MSRV (1.85.0)
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSRV Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          targets: ${{ matrix.target }}
      - name: Check against MSRV
        run: cargo check --target ${{ matrix.target }} --all-targets
