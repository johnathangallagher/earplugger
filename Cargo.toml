[package]
name = "earplugger"
version = "1.2.0"
edition = "2024"
authors = ["Johnathan Gallagher <johnathangallagherusa@gmail.com>"]
description = "Lightweight, zero-overhead Windows utility to automatically resynchronize Voicemeeter audio engines on KVM and USB device reconnects"
readme = "README.md"
repository = "https://github.com/johnathangallagher/earplugger"
license = "PolyForm-Noncommercial-1.0.0"
keywords = ["voicemeeter", "kvm", "audio", "windows", "hotplug"]
categories = ["command-line-utilities", "multimedia::audio", "os::windows-apis"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = true

[dependencies]
