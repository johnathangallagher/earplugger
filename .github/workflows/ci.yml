name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release --verbose
      - name: Check Formatting
        run: cargo fmt --check
        continue-on-error: true
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: earplugger-x86_64-pc-windows-msvc
          path: target/release/earplugger.exe
