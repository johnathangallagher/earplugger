name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump type (auto detects breaking/feat/fix from Conventional Commits)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (simulate release notes & version bump without committing, tagging, or publishing)"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release & Generate Notes
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.engine.outputs.tag }}
      version: ${{ steps.engine.outputs.version }}
      dry_run: ${{ steps.engine.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Release Engine
        id: engine
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "antigravity-runner[bot]"
            git config user.email "antigravity-runner[bot]@users.noreply.github.com"
            DRY_RUN_ARG=""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              DRY_RUN_ARG="--dry-run"
            fi
            python .github/scripts/release.py --bump "${{ inputs.bump }}" $DRY_RUN_ARG
          else
            python .github/scripts/release.py --current-tag "${{ github.ref_name }}"
          fi

      - name: Upload Release Notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build-release:
    name: Build Release Binary
    needs: prepare
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binary
          path: target/release/earplugger.exe

  publish:
    name: Publish GitHub Release
    needs: [prepare, build-release]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            release-assets/earplugger.exe \
            --repo "${{ github.repository }}" \
            --title "${{ needs.prepare.outputs.tag }}" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --verify-tag



